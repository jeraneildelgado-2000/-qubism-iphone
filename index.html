<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Qubism">
<link rel="manifest" href="./manifest.json">
<title>Qubism iPhone v0.5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
button{font:inherit;border:0}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;background:#f3f3f3}
header{height:58px;flex:0 0 58px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px}
h1{font-size:20px;margin:0;white-space:nowrap;color:#111}.muted{font-size:13px;color:#888;font-weight:400}.top{display:flex;gap:6px;flex:0 0 auto}
button{border-radius:11px;background:#e8e8e8;padding:9px 12px;font-weight:650;color:#222;cursor:pointer;touch-action:manipulation}.top button{min-width:45px}
#scene{position:relative;flex:1;min-height:120px;touch-action:none;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.92);border-radius:16px;padding:7px 11px;color:#555;font-size:12px;pointer-events:none;box-shadow:0 1px 5px rgba(0,0,0,.08)}
#info{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:10px;padding:6px 8px;font-size:11px;color:#555;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;padding:7px 9px;background:#fafafa;border-top:1px solid #ddd;overflow-x:auto;flex:0 0 58px}.sw{flex:0 0 42px;width:42px;height:42px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #aaa}.sel{box-shadow:0 0 0 2px #111}
.tools{background:#fff;border-top:1px solid #ddd;padding:7px 7px calc(7px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;flex:0 0 auto}.tool{min-width:72px;padding:7px 8px}.tool b{display:block;font-size:18px;line-height:21px}.tool small{font-size:10px;color:#666}.active{background:#dceeff}
@media (max-width:390px){h1{font-size:18px}.tool{min-width:66px}}
</style>
</head>
<body>
<div id="app">
<header><h1>Qubism <span class="muted">iPhone · 0.5</span></h1><div class="top"><button id="undo" aria-label="Deshacer">↶</button><button id="redo" aria-label="Rehacer">↷</button><button id="save">Guardar</button></div></header>
<div id="scene"><canvas id="c"></canvas><div id="hint">Toca una cara · arrastra para modelar · dos dedos para navegar</div><div id="info"></div></div>
<div class="row" id="colors"><div class="sw sel" data-c="#e53935" style="background:#e53935"></div><div class="sw" data-c="#43a047" style="background:#43a047"></div><div class="sw" data-c="#1e88e5" style="background:#1e88e5"></div><div class="sw" data-c="#8e24aa" style="background:#8e24aa"></div><div class="sw" data-c="#fb8c00" style="background:#fb8c00"></div><div class="sw" data-c="#fdd835" style="background:#fdd835"></div><div class="sw" data-c="#546e7a" style="background:#546e7a"></div></div>
<div class="tools"><button class="tool" id="add"><b>＋</b><small>Cubo</small></button><button class="tool" id="del"><b>⌫</b><small>Borrar</small></button><button class="tool active" id="face"><b>◇</b><small>Caras</small></button><button class="tool" id="grid"><b>▦</b><small>Rejilla</small></button><button class="tool" id="rot"><b>⟳</b><small>Rotar</small></button><button class="tool" id="mirror"><b>⇄</b><small>Reflejar</small></button><button class="tool" id="dup"><b>⧉</b><small>Duplicar</small></button><button class="tool" id="center"><b>⌾</b><small>Centrar</small></button><button class="tool" id="png"><b>▣</b><small>PNG</small></button><button class="tool" id="new"><b>✕</b><small>Nuevo</small></button></div>
</div>
<script>
(() => {
'use strict';
function init(){
 const cv=document.getElementById('c'), ctx=cv.getContext('2d'), scene=document.getElementById('scene'), info=document.getElementById('info');
 let cubes=[makeCube(0,0,0)], selected=0, selectedFace=3, editMode=true, showGrid=true, color='#e53935';
 let yaw=-0.65,pitch=0.55,zoom=115,history=[],future=[]; let pointers=new Map(), gesture=null;
 const faces=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[1,5,6,2],[0,3,7,4]], names=['frontal','trasera','inferior','superior','derecha','izquierda'];
 function makeCube(x,y,z){return{x,y,z,sx:1,sy:1,sz:1,color,ext:{px:0,nx:0,py:0,ny:0,pz:0,nz:0}}}
 function snapshot(){return JSON.stringify({cubes,selected,selectedFace,editMode,showGrid,yaw,pitch,zoom,color})}
 function saveHistory(){history.push(snapshot());if(history.length>80)history.shift();future=[]}
 function restore(s){const o=JSON.parse(s);cubes=o.cubes||[];selected=o.selected??0;selectedFace=o.selectedFace??3;editMode=o.editMode!==false;showGrid=o.showGrid!==false;yaw=o.yaw??-0.65;pitch=o.pitch??0.55;zoom=o.zoom??115;color=o.color||'#e53935';selected=Math.min(selected,cubes.length-1);draw()}
 function resize(){const r=cv.getBoundingClientRect(),d=Math.max(1,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);draw()}
 window.addEventListener('resize',resize); if(window.ResizeObserver)new ResizeObserver(resize).observe(scene);
 function rotatePoint(p){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const x=p[0]*cy-p[2]*sy,z=p[0]*sy+p[2]*cy;return[x,z*cp-p[1]*sp,z*sp+p[1]*cp]}
 function project(p){const r=rotatePoint(p);return[cv.clientWidth/2+r[0]*zoom,cv.clientHeight/2-r[1]*zoom,r[2]]}
 function vertices(q){const x=q.x,y=q.y,z=q.z,a=q.sx/2,b=q.sy/2,c=q.sz/2,e=q.ext;return [[x-a-e.nx,y-b-e.ny,z-c-e.nz],[x+a+e.px,y-b-e.ny,z-c-e.nz],[x+a+e.px,y+b+e.py,z-c-e.nz],[x-a-e.nx,y+b+e.py,z-c-e.nz],[x-a-e.nx,y-b-e.ny,z+c+e.pz],[x+a+e.px,y-b-e.ny,z+c+e.pz],[x+a+e.px,y+b+e.py,z+c+e.pz],[x-a-e.nx,y+b+e.py,z+c+e.pz]].map(project)}
 function shade(hex,k){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return `rgb(${Math.max(0,Math.min(255,Math.round(r*k)))},${Math.max(0,Math.min(255,Math.round(g*k)))},${Math.max(0,Math.min(255,Math.round(b*k)))})`}
 function line(a,b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
 function draw(){const W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;ctx.clearRect(0,0,W,H);ctx.fillStyle='#f3f3f3';ctx.fillRect(0,0,W,H);
  if(showGrid){ctx.strokeStyle='rgba(60,60,60,.12)';ctx.lineWidth=1;for(let i=-5;i<=5;i++){line(project([i,-.51,-5]),project([i,-.51,5]));line(project([-5,-.51,i]),project([5,-.51,i]))}}
  const all=[];cubes.forEach((q,qi)=>{const v=vertices(q);faces.forEach((f,fi)=>all.push({q,qi,fi,p:f.map(i=>v[i]),z:f.reduce((s,i)=>s+v[i][2],0)/4}))});all.sort((a,b)=>a.z-b.z);
  all.forEach(o=>{ctx.beginPath();ctx.moveTo(o.p[0][0],o.p[0][1]);o.p.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=shade(o.q.color,[.72,.9,.65,1,.86,.58][o.fi]);ctx.fill();ctx.lineWidth=o.qi===selected&&o.fi===selectedFace&&editMode?3:1.3;ctx.strokeStyle=o.qi===selected&&o.fi===selectedFace&&editMode?'#111':'#222';ctx.stroke()});
  info.textContent=cubes.length?`Cubo ${selected+1}/${cubes.length} · ${names[selectedFace]}`:'Sin cubos';
 }
 function pointIn(px,py,p){let inside=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1],hit=((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi);if(hit)inside=!inside}return inside}
 function hit(px,py){const items=[];cubes.forEach((q,qi)=>{const v=vertices(q);faces.forEach((f,fi)=>items.push({qi,fi,p:f.map(i=>v[i]),z:f.reduce((s,i)=>s+v[i][2],0)/4}))});items.sort((a,b)=>b.z-a.z);return items.find(o=>pointIn(px,py,o.p))||null}
 function local(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
 function setPointer(e){pointers.set(e.pointerId,local(e));try{cv.setPointerCapture(e.pointerId)}catch(_){} }
 function updateGesture(){if(pointers.size===2){const a=[...pointers.values()][0],b=[...pointers.values()][1];gesture={dist:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,yaw,pitch,zoom};}}
 cv.addEventListener('pointerdown',e=>{setPointer(e);if(pointers.size===1){const p=local(e);const h=hit(p.x,p.y);if(h){selected=h.qi;selectedFace=h.fi;draw();gesture={mode:editMode?'edit':'orbit',x:p.x,y:p.y,base:JSON.parse(JSON.stringify(cubes[selected]))};}else{gesture={mode:'orbit',x:p.x,y:p.y,yaw,pitch};}}else if(pointers.size===2){updateGesture();}});
 cv.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),p=local(e);pointers.set(e.pointerId,p);
  if(pointers.size===2){if(!gesture)updateGesture();const a=[...pointers.values()][0],b=[...pointers.values()][1],dist=Math.max(10,Math.hypot(a.x-b.x,a.y-b.y));zoom=Math.max(55,Math.min(260,gesture.zoom*(dist/gesture.dist)));yaw=gesture.yaw+(a.x-b.x-(0))/2500;pitch=Math.max(-1.25,Math.min(1.25,gesture.pitch-(a.y-b.y)/2500));draw();return;}
  if(pointers.size!==1||!gesture)return;const dx=p.x-old.x,dy=p.y-old.y;
  if(gesture.mode==='edit'&&editMode&&selected>=0){const f=[['pz',dy],['nz',-dy],['ny',-dy],['py',-dy],['px',dx],['nx',-dx]][selectedFace];if(!gesture.didEdit&&Math.hypot(p.x-gesture.x,p.y-gesture.y)>3){saveHistory();gesture.didEdit=true}if(gesture.didEdit){cubes[selected].ext[f[0]]=Math.max(0,Math.min(4,cubes[selected].ext[f[0]]+f[1]/(zoom*1.3)));draw();}}
  else{yaw+=dx*.008;pitch=Math.max(-1.2,Math.min(1.2,pitch-dy*.006));draw();}
 });
 function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)gesture=null}
 cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);cv.addEventListener('pointerleave',()=>{});
 function act(id,fn){const el=document.getElementById(id);if(el)el.addEventListener('click',e=>{e.preventDefault();fn()})}
 act('add',()=>{saveHistory();const q=makeCube(cubes.length?cubes[selected].x+1.25:0,0,0);cubes.push(q);selected=cubes.length-1;draw()});
 act('del',()=>{if(selected>=0&&cubes.length){saveHistory();cubes.splice(selected,1);selected=Math.min(selected,cubes.length-1);draw()}});
 act('face',()=>{editMode=!editMode;document.getElementById('face').classList.toggle('active',editMode);draw()});
 act('grid',()=>{showGrid=!showGrid;document.getElementById('grid').classList.toggle('active',showGrid);draw()});
 act('rot',()=>{if(selected>=0){saveHistory();const q=cubes[selected];[q.sx,q.sz]=[q.sz,q.sx];draw()}});
 act('mirror',()=>{if(selected>=0){saveHistory();const q=cubes[selected];[q.ext.px,q.ext.nx]=[q.ext.nx,q.ext.px];[q.ext.pz,q.ext.nz]=[q.ext.nz,q.ext.pz];draw()}});
 act('dup',()=>{if(selected>=0){saveHistory();const q=JSON.parse(JSON.stringify(cubes[selected]));q.x+=1.2;cubes.push(q);selected=cubes.length-1;draw()}});
 act('center',()=>{yaw=-0.65;pitch=0.55;zoom=115;draw()});
 act('undo',()=>{if(history.length){future.push(snapshot());restore(history.pop())}});
 act('redo',()=>{if(future.length){history.push(snapshot());restore(future.pop())}});
 act('save',()=>{try{localStorage.setItem('qubism-iphone-v05',snapshot());alert('Proyecto guardado en este iPhone.')}catch(e){alert('No se pudo guardar en este navegador.')}});
 act('new',()=>{if(confirm('¿Crear un proyecto nuevo?')){saveHistory();cubes=[];selected=-1;draw()}});
 act('png',()=>{const a=document.createElement('a');a.download='qubism.png';a.href=cv.toDataURL('image/png');a.click()});
 document.querySelectorAll('.sw').forEach(s=>s.addEventListener('click',()=>{document.querySelectorAll('.sw').forEach(a=>a.classList.remove('sel'));s.classList.add('sel');color=s.dataset.c;if(selected>=0){saveHistory();cubes[selected].color=color;draw()}}));
 try{const stored=localStorage.getItem('qubism-iphone-v05');if(stored){restore(stored)}}catch(_){}
 resize();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
