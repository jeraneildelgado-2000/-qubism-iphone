<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Qubism"><title>Qubism iPhone v0.4</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial}#app{height:100%;display:flex;flex-direction:column}header{height:58px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 10px}h1{font-size:20px;margin:0}.muted{font-size:13px;color:#888;font-weight:400}.top{display:flex;gap:6px}button{border:0;border-radius:11px;background:#e8e8e8;padding:9px 12px;font-weight:650;color:#222}#scene{position:relative;flex:1;min-height:0;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fffdf;border-radius:16px;padding:7px 11px;color:#555;font-size:12px;pointer-events:none}#info{position:absolute;left:10px;bottom:10px;background:#fffdf;border-radius:10px;padding:6px 8px;font-size:11px;color:#555;pointer-events:none}.row{display:flex;gap:8px;align-items:center;padding:7px 9px;background:#fafafa;border-top:1px solid #ddd;overflow:auto}.sw{flex:0 0 29px;width:29px;height:29px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #aaa}.sel{box-shadow:0 0 0 2px #111}.tools{background:white;border-top:1px solid #ddd;padding:7px 7px calc(7px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow:auto}.tool{min-width:68px;padding:7px 8px}.tool b{display:block;font-size:18px}.tool small{font-size:10px;color:#666}.active{background:#dceeff}</style></head><body><div id="app"><header><h1>Qubism <span class="muted">iPhone · 0.4</span></h1><div class="top"><button id="undo">↶</button><button id="redo">↷</button><button id="save">Guardar</button></div></header><div id="scene"><canvas id="c"></canvas><div id="hint">Toca una cara · arrastra para modelar · dos dedos para navegar</div><div id="info"></div></div><div class="row" id="colors"><div class="sw sel" data-c="#e53935" style="background:#e53935"></div><div class="sw" data-c="#43a047" style="background:#43a047"></div><div class="sw" data-c="#1e88e5" style="background:#1e88e5"></div><div class="sw" data-c="#8e24aa" style="background:#8e24aa"></div><div class="sw" data-c="#fb8c00" style="background:#fb8c00"></div><div class="sw" data-c="#fdd835" style="background:#fdd835"></div><div class="sw" data-c="#546e7a" style="background:#546e7a"></div></div><div class="tools"><button class="tool" id="add"><b>＋</b><small>Cubo</small></button><button class="tool" id="del"><b>⌫</b><small>Borrar</small></button><button class="tool active" id="face"><b>◇</b><small>Caras</small></button><button class="tool" id="grid"><b>▦</b><small>Rejilla</small></button><button class="tool" id="rot"><b>⟳</b><small>Rotar</small></button><button class="tool" id="mirror"><b>⇄</b><small>Reflejar</small></button><button class="tool" id="dup"><b>⧉</b><small>Duplicar</small></button><button class="tool" id="center"><b>⌾</b><small>Centrar</small></button><button class="tool" id="png"><b>▣</b><small>PNG</small></button><button class="tool" id="new"><b>✕</b><small>Nuevo</small></button></div></div><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),scene=document.getElementById('scene'),info=document.getElementById('info');let cubes=[cube(0,0,0)],sel=0,face=3,faceMode=true,showGrid=true,color='#e53935',yaw=-0.65,pitch=0.55,scale=120,hist=[],future=[],active=new Map();
function cube(x,y,z){return{x,y,z,sx:1,sy:1,sz:1,color,ext:{px:0,nx:0,py:0,ny:0,pz:0,nz:0}}}function snapshot(){return JSON.stringify(cubes)}function push(){hist.push(snapshot());if(hist.length>60)hist.shift();future=[]}function restore(s){cubes=JSON.parse(s);sel=Math.min(sel,cubes.length-1);draw()}function resize(){const r=cv.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
function rot(p){let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p[0]*cy-p[2]*sy,z=p[0]*sy+p[2]*cy;return[x,z*cp-p[1]*sp,z*sp+p[1]*cp]}function proj(p){let r=rot(p);return[cv.clientWidth/2+r[0]*scale,cv.clientHeight/2-r[1]*scale,r[2]]}
const faces=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[1,5,6,2],[0,3,7,4]], names=['frontal','trasera','inferior','superior','derecha','izquierda'];
function verts(q){let x=q.x,y=q.y,z=q.z,a=q.sx/2,b=q.sy/2,c=q.sz/2,e=q.ext;return [[x-a-e.nx,y-b-e.ny,z-c-e.nz],[x+a+e.px,y-b-e.ny,z-c-e.nz],[x+a+e.px,y+b+e.py,z-c-e.nz],[x-a-e.nx,y+b+e.py,z-c-e.nz],[x-a-e.nx,y-b-e.ny,z+c+e.pz],[x+a+e.px,y-b-e.ny,z+c+e.pz],[x+a+e.px,y+b+e.py,z+c+e.pz],[x-a-e.nx,y+b+e.py,z+c+e.pz]].map(proj)}
function shade(hex,k){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return`rgb(${Math.max(0,Math.min(255,r*k|0))},${Math.max(0,Math.min(255,g*k|0))},${Math.max(0,Math.min(255,b*k|0))})`}
function draw(){const W=cv.clientWidth,H=cv.clientHeight;ctx.clearRect(0,0,W,H);ctx.fillStyle='#f3f3f3';ctx.fillRect(0,0,W,H);if(showGrid){ctx.strokeStyle='rgba(60,60,60,.12)';ctx.lineWidth=1;for(let i=-5;i<=5;i++){line(proj([i,-.51,-5]),proj([i,-.51,5]));line(proj([-5,-.51,i]),proj([5,-.51,i]))}}let all=[];cubes.forEach((q,qi)=>{let v=verts(q);faces.forEach((f,fi)=>all.push({q,qi,fi,p:f.map(i=>v[i]),z:f.reduce((s,i)=>s+v[i][2],0)/4}))});all.sort((a,b)=>a.z-b.z);all.forEach(o=>{ctx.beginPath();ctx.moveTo(o.p[0][0],o.p[0][1]);o.p.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=shade(o.q.color,[.72,.9,.65,1,.86,.58][o.fi]);ctx.fill();ctx.lineWidth=o.qi===sel&&o.fi===face&&faceMode?3:1.3;ctx.strokeStyle=o.qi===sel&&o.fi===face&&faceMode?'#111':'#222';ctx.stroke()});info.textContent=cubes.length?`Cubo ${sel+1}/${cubes.length} · ${names[face]}`:'Sin cubos'}function line(a,b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function pointIn(px,py,p){let inside=false;for(let i=0,j=p.length-1;i<p.length;j=i++){let xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1],hit=((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi);if(hit)inside=!inside}return inside}function hit(px,py){let best=null,items=[];cubes.forEach((q,qi)=>{let v=verts(q);faces.forEach((f,fi)=>items.push({qi,fi,p:f.map(i=>v[i]),z:f.reduce((s,i)=>s+v[i][2],0)/4}))});items.sort((a,b)=>b.z-a.z);for(const o of items)if(pointIn(px,py,o.p)){best=o;break}return best}
function local(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{const p=local(e);active.set(e.pointerId,p);if(active.size===1){const h=hit(p.x,p.y);if(h){sel=h.qi;face=h.fi;draw()}}else if(active.size===2){active.clear();active.set(e.pointerId,p)}});cv.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;const p=local(e),old=active.get(e.pointerId),dx=p.x-old.x,dy=p.y-old.y;active.set(e.pointerId,p);if(active.size===1&&faceMode&&sel>=0){pushOnce();const f=[['pz',dy],['nz',-dy],['ny',-dy],['py',-dy],['px',dx],['nx',-dx]][face];cubes[sel].ext[f[0]]=Math.max(0,Math.min(4,cubes[sel].ext[f[0]]+f[1]/(scale*1.4)));draw()}else if(active.size===1){yaw+=dx*.008;pitch=Math.max(-1.2,Math.min(1.2,pitch-dy*.006));draw()}});cv.addEventListener('pointerup',e=>{active.delete(e.pointerId);once=false});cv.addEventListener('pointercancel',e=>active.delete(e.pointerId));let once=false;function pushOnce(){if(!once){push();once=true}}
function act(id,fn){document.getElementById(id).onclick=fn}act('add',()=>{push();cubes.push(cube(cubes.length*1.15,0,0));sel=cubes.length-1;draw()});act('del',()=>{if(sel>=0){push();cubes.splice(sel,1);sel=cubes.length-1;draw()}});act('face',()=>{faceMode=!faceMode;document.getElementById('face').classList.toggle('active',faceMode);draw()});act('grid',()=>{showGrid=!showGrid;draw()});act('rot',()=>{if(sel>=0){push();let q=cubes[sel],t=q.sx;q.sx=q.sz;q.sz=t;draw()}});act('mirror',()=>{if(sel>=0){push();let q=cubes[sel];[q.ext.px,q.ext.nx]=[q.ext.nx,q.ext.px];[q.ext.pz,q.ext.nz]=[q.ext.nz,q.ext.pz];draw()}});act('dup',()=>{if(sel>=0){push();let q=JSON.parse(JSON.stringify(cubes[sel]));q.x+=1.2;sel=cubes.push(q)-1;draw()}});act('center',()=>{yaw=-.65;pitch=.55;scale=120;draw()});act('undo',()=>{if(hist.length){future.push(snapshot());restore(hist.pop())}});act('redo',()=>{if(future.length){hist.push(snapshot());restore(future.pop())}});act('save',()=>{localStorage.setItem('qubism-v04',snapshot());alert('Proyecto guardado en este iPhone.')});act('new',()=>{if(confirm('¿Crear un proyecto nuevo?')){push();cubes=[];sel=-1;draw()}});act('png',()=>{const a=document.createElement('a');a.download='qubism.png';a.href=cv.toDataURL('image/png');a.click()});document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{document.querySelectorAll('.sw').forEach(a=>a.classList.remove('sel'));s.classList.add('sel');color=s.dataset.c;if(sel>=0)cubes[sel].color=color;draw()});resize();
</script></body></html>
